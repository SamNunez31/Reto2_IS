name: CI

# Verifica backend y frontend en cada push y pull request (hallazgo BE-M1 de AUDITORIA.md).
# Para que bloquee los despliegues: GitHub → Settings → Branches → proteger "main" y exigir estos checks.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run contract:check
      - run: npm run gateway:check
      - run: npm run test:roles

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx ng test --watch=false --browsers=ChromeHeadless
      - run: npm run build
