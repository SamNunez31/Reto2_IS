# GENERADO con `npm run contract:split` a partir de contracts/posada-ec-openapi.yaml. No editar a mano.
# Servicio: integration. Política de versiones: contracts/POLITICA_VERSIONADO.md
openapi: 3.0.0
info:
  title: Posada EC — Servicio de Integración
  description: |-
    Webhooks hacia terceros, empuje de stock a Booking por gRPC, trabajos programados y consulta del registro de eventos.

    Contrato derivado del contrato propio de Posada EC v1.0.0; versión propia de este servicio con SemVer (ver contracts/POLITICA_VERSIONADO.md).
  version: 1.0.0
x-servicio:
  nombre: integration
  tablas_propias:
    - webhook_suscripcion
    - webhook_evento
    - webhook_entrega
    - evento_recibido
  eventos_que_publica: []
  eventos_que_consume:
    - ReservaCreada
    - ReservaConfirmada
    - ReservaCancelada
    - ReservaRechazada
    - ReservaExpirada
    - EstanciaCompletada
    - StockCambiado
  contrato_de_eventos: ../events/posada-events-asyncapi.yaml
servers:
  - url: /
    description: Detrás del API Gateway (ver docs/ARQUITECTURA_MICROSERVICIOS.md §6)
tags:
  - name: Webhooks
    description: ''
  - name: Administración
    description: 'Ruta propia: panel del ADMIN'
  - name: Salud
    description: ''
paths:
  /health:
    get:
      operationId: HealthController_health
      summary: Estado de la app y de la BD (SELECT 1)
      parameters: []
      responses:
        '200':
          description: ''
      tags:
        - Salud
  /api/v1/webhooks:
    get:
      operationId: AlojamientosController_listWebhooks
      summary: Listar suscripciones
      parameters: []
      responses:
        '200':
          description: Suscripciones activas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebhookSubscription'
      security:
        - OAuth2Security:
            - alojamientos:webhooks
      tags:
        - Webhooks
    post:
      operationId: AlojamientosController_createWebhook
      summary: Registrar webhook
      description: Solo https. El secreto (32 bytes) se muestra únicamente en esta respuesta.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSubscriptionDto'
      responses:
        '201':
          description: Webhook registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscription'
      security:
        - OAuth2Security:
            - alojamientos:webhooks
      tags:
        - Webhooks
  /api/v1/webhooks/{id}:
    delete:
      operationId: AlojamientosController_deleteWebhook
      summary: Eliminar suscripción
      parameters:
        - name: id
          required: true
          in: path
          schema:
            format: uuid
            type: string
      responses:
        '204':
          description: Eliminado
      security:
        - OAuth2Security:
            - alojamientos:webhooks
      tags:
        - Webhooks
  /api/v1/admin/events:
    get:
      operationId: AdminController_eventos
      summary: Eventos de negocio (outbox)
      parameters:
        - name: tipo
          required: false
          in: query
          schema:
            maxLength: 60
            type: string
        - name: limit
          required: true
          in: query
          schema:
            minimum: 1
            maximum: 100
            default: 20
            type: number
        - name: offset
          required: true
          in: query
          schema:
            minimum: 0
            default: 0
            type: number
      responses:
        '200':
          description: ''
      tags:
        - Administración
      security:
        - bearer: []
  /api/v1/admin/jobs/{nombre}/ejecutar:
    post:
      operationId: AdminController_ejecutar
      summary: 'Ejecutar un job: completar-estancias, publicar-outbox, purgar-idempotencia'
      parameters:
        - name: nombre
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      tags:
        - Administración
      security:
        - bearer: []
components:
  securitySchemes:
    OAuth2Security:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.booking-hub.com/oauth2/authorize
          tokenUrl: https://auth.booking-hub.com/oauth2/token
          scopes:
            alojamientos:read: Leer información de alojamientos, disponibilidades y reservas
            alojamientos:book: Crear y alterar reservas
            alojamientos:cancel: Cancelar reservas
            alojamientos:webhooks: Gestionar webhooks
        clientCredentials:
          tokenUrl: https://auth.booking-hub.com/oauth2/token
          scopes:
            alojamientos:read: Leer información de alojamientos, disponibilidades y reservas
            alojamientos:book: Crear y alterar reservas
            alojamientos:cancel: Cancelar reservas
            alojamientos:webhooks: Gestionar webhooks
      description: OAuth2 del contrato. En este prototipo el token Bearer se emite en /api/v1/auth/login.
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    WebhookSubscription:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
        events:
          type: array
          items:
            type: string
        secret:
          type: string
          description: Solo se muestra al crear
      required:
        - id
        - url
        - events
    WebhookSubscriptionDto:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
          description: Solo https
          maxLength: 500
        events:
          type: array
          items:
            type: string
            enum:
              - ORDER_CONFIRMED
              - ORDER_CANCELLED
        secret:
          type: string
          description: 'Se ignora en la entrada: el servidor genera un secreto de 32 bytes'
          maxLength: 200
      required:
        - id
        - url
        - events
