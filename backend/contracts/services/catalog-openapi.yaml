    SearchAccommodationRequestDto:
      type: object
      properties:
        booker:
          $ref: '#/components/schemas/BookerDto'
        checkin:
          type: string
          pattern: FECHA
        checkout:
          type: string
          pattern: FECHA
        city:
          type: number
          description: Id de ciudad (catálogo /constants)
          minimum: 1
        country:
          type: string
          enum:
            - ec
          pattern: /^[a-z]{2}$/
        guests:
          $ref: '#/components/schemas/HuespedesDto'
        extras:
          type: array
          items:
            type: string
            enum:
              - extra_charges
              - products
        rows:
          type: number
          default: 100
          minimum: 10
          maximum: 100
        page:
          type: string
          description: Cursor opaco devuelto en next_page
          minLength: 1
          maxLength: 200
        province:
          type: string
          minLength: 3
          maxLength: 40
        accommodation_type:
          type: number
          description: 'Extensión: id de tipo de alojamiento'
          minimum: 1
        max_price:
          type: number
          description: 'Extensión: precio máximo por noche (USD)'
          minimum: 0
        min_stars:
          type: number
          description: 'Extensión: estrellas mínimas'
          minimum: 1
          maximum: 5
        sort_by:
          type: string
          description: 'Extensión: criterio de orden'
          enum:
            - relevancia
            - precio_asc
            - precio_desc
            - calificacion
        currency:
          type: string
          enum:
            - USD
          pattern: /^[A-Z]{3}$/
      required:
        - booker
        - checkin
        - checkout
        - guests
